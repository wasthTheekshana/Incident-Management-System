# Local development dependencies only. The app itself runs on the host.
# Host ports are offset (5433/6380) so they never clash with other local Postgres/Redis instances.
# Optional dev inbox for outgoing mail: docker compose -f docker-compose.dev.yml --profile mail up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cims
      POSTGRES_PASSWORD: cims_dev_password
      POSTGRES_DB: cims
    ports: ["127.0.0.1:5433:5432"]
    volumes: [cims_pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # inbox UI

volumes:
  cims_pgdata:
