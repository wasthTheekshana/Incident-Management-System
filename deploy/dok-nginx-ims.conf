# Server blocks for ims.testsys.shop. Add them to ~/dok-stack/nginx/nginx.conf, before the default catch-all.
# Add PART 1 first, reload, issue the certificate, then add PART 2 and reload again (see docs/deploy-dok-server.md).

# ---------- PART 1: HTTP (certificate challenge + redirect) ----------
server {
    listen 80;
    server_name ims.testsys.shop;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- PART 2: HTTPS ----------
server {
    listen 443 ssl;
    server_name ims.testsys.shop;
    ssl_certificate     /etc/letsencrypt/live/ims.testsys.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ims.testsys.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    server_tokens off;
    client_max_body_size 55m;

    location ~ /\.(?!well-known) { deny all; return 404; }

    # API. The backend trusts exactly one proxy hop, so these headers must be set here and nowhere in between.
    # X-Ims-Proxy-Key must equal PROXY_KEY in ~/ims-stack/.env; without it the API answers 403. Set it only in this
    # server block (never in git): replace the placeholder below with the real value.
    location /api/ {
        proxy_pass         http://ims-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Ims-Proxy-Key "PASTE_PROXY_KEY_HERE";
        proxy_read_timeout 120s;
    }

    # Single-page app.
    location / {
        proxy_pass         http://ims-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
