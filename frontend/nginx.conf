# Serves the single-page app only. TLS is terminated, and /api is routed to the backend, by the shared Nginx in front.
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 55m;   # multipart ceiling; per-file limits are enforced by the API

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
