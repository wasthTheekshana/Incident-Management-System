# CIMS production stack for the DOK shared server (follows the dok-docker-deploy rules).
#
# Lives in ~/ims-stack. Run every command from that folder:  cd ~/ims-stack
# Secrets come from the untracked .env next to this file (see .env.prod.example). Nothing here publishes a host port:
# the shared Nginx in ~/dok-stack reaches `web` and `api` over the external shared-nginx network.
# Data lives on the data disk (/mnt/disks/data), never on the boot disk. See docs/deploy-dok-server.md.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ims-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_USER: cims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cims
    command: >
      postgres -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c work_mem=8MB
               -c max_connections=60
    volumes:
      - /mnt/disks/data/db/ims:/var/lib/postgresql/data
    networks:
      - ims-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
          pids: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cims -d cims"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ims-redis
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - /mnt/disks/data/db/ims-redis:/data
    networks:
      - ims-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies database migrations, then exits. No restart policy and no healthcheck by design.
  migrate:
    build: ./backend
    container_name: ims-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://cims:${POSTGRES_PASSWORD}@postgres:5432/cims?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ims-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 100

  api:
    build: ./backend
    container_name: ims-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://cims:${POSTGRES_PASSWORD}@postgres:5432/cims?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_URL: ${APP_URL:?set APP_URL}
      CORS_ORIGIN: ${APP_URL}
      COOKIE_SECURE: "true"
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
    volumes:
      - /mnt/disks/data/documents/ims:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ims-net
      - shared-nginx
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
          pids: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Static single-page app served by an unprivileged nginx. The shared Nginx sends /api to `api` and everything else here.
  web:
    build: ./frontend
    container_name: ims-web
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - shared-nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 100
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ims-net:
    name: ims-app-net
  shared-nginx:
    name: shared-nginx
    external: true
